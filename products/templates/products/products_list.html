<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <title>Products</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <h1>Our Products</h1>

    <a href="{% url 'home' %}">Back to Home</a>
    <a href="{% url 'recommended_products' %}">Recommended for you</a>

    <form method="get">
        <input type="text" name="q" placeholder="Search products..." value="{{ request.GET.q }}">
        <select name="category">
            <option value="">All Categories</option>
            {% for category in categories %}
                <option value="{{ category.id }}">{{ category.name }}</option>
            {% endfor %}
        </select>
        <button type="submit">Filter</button>
    </form>

    <hr>

    {% for product in products %}
        <div style="border: 1px solid black; margin: 10px; padding: 10px;">
            {% if product.image %}
                <img src="{{ product.image_url }}" width="150"><br>
            {% endif %}
            <h3>{{ product.name }}</h3>
            <p>Price: {{ product.price }} EGP</p>
            <p>Stock: {{ product.stock }}</p>
            <a href="{% url 'product_detail' product.id %}">View Details</a>
            <a href="{%url 'add_to_cart' product.id %}">Add to Cart</a>
        </div>
    {% empty %}
        <p>No products found.</p>
    {% endfor %}
</body>
</html>
